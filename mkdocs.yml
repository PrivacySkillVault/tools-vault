site_name: "Privacy Skill Vault"
site_url: "https://tools.privacyskillvault.com/"
site_description: "Privacy-first browser-based SOC and blue-team utilities"
site_author: "Privacy Skill Vault"
theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/branding/PSV-colored.png
  language: en
  favicon: assets/branding/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: slate
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: "Switch to dark mode"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: slate
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: "Switch to light mode"
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - content.action.view
extra_css:
  - stylesheets/extra.css
  - stylesheets/tools.css
extra_javascript:
  - javascripts/tools.js
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.keys
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
nav:
  - "Tools": "index.md"
